<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Document</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

    <link rel="stylesheet" href="sample.css" />

</head>

<body>
    <section>
        <div>
            <div>
                <h2>GET IN TOUCH TO KNOW MORE ABOUT OUR SERVICES</h2>
                <p>Our team is ready to answer all your queries.</p>
            </div>
            <div class="row container">
                <div class="col-6">
                    <div>
                        <form class="border d-flex flex-column w-50">
                          
                            <input type="text" id="name" name="name" placeholder="Enter your name" required>

                         
                            <input type="email" id="email" name="email" placeholder="Enter your email" required>

                           
                            <input type="tel" id="phone" name="phone" placeholder="Enter 10-digit phone number"
                                pattern="[0-9]{10}" maxlength="10" required>

                            <button type="submit">Submit</button>
                        </form>
                    </div>
                </div>
                <div class="col-6"></div>

            </div>

        </div>
    </section>

    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
